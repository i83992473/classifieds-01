<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Newspaper background -->
  <rect x="2" y="2" width="28" height="28" fill="#f8f8f8" stroke="#333" stroke-width="1"/>
  
  <!-- Folded corner effect -->
  <path d="M 26 2 L 30 2 L 30 6 L 26 2 Z" fill="#e0e0e0" stroke="#333" stroke-width="0.5"/>
  
  <!-- Newspaper header -->
  <rect x="4" y="4" width="24" height="4" fill="#333"/>
  <text x="16" y="7" text-anchor="middle" fill="white" font-family="serif" font-size="3" font-weight="bold">CLASSIFIED</text>
  
  <!-- Text lines representing classified ads -->
  <rect x="6" y="10" width="20" height="0.8" fill="#666"/>
  <rect x="6" y="12" width="16" height="0.8" fill="#666"/>
  <rect x="6" y="14" width="18" height="0.8" fill="#666"/>
  <rect x="6" y="16" width="14" height="0.8" fill="#666"/>
  <rect x="6" y="18" width="20" height="0.8" fill="#666"/>
  <rect x="6" y="20" width="12" height="0.8" fill="#666"/>
  <rect x="6" y="22" width="17" height="0.8" fill="#666"/>
  <rect x="6" y="24" width="15" height="0.8" fill="#666"/>
  <rect x="6" y="26" width="19" height="0.8" fill="#666"/>
  
  <!-- Small decorative elements -->
  <circle cx="8" cy="9" r="0.5" fill="#999"/>
  <circle cx="24" cy="9" r="0.5" fill="#999"/>
</svg> 